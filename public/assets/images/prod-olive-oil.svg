<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D7C0F" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4D7C0F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="468" height="468" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Backdrop Glow Circle -->
  <circle cx="250" cy="210" r="140" fill="#4D7C0F" opacity="0.08" />
  <circle cx="250" cy="210" r="105" fill="#65A30D" opacity="0.12" />

  <!-- Product Icon / Illustration -->
  <g filter="url(#drop)" transform="translate(150, 110)">
    
      <!-- Bottle -->
      <path d="M85 20 L115 20 L115 45 L135 75 L135 180 L65 180 L65 75 L85 45 Z" fill="#65A30D" />
      <rect x="80" y="90" width="40" height="60" rx="6" fill="#ECFCCB" />
      <circle cx="100" cy="115" r="10" fill="#4D7C0F" />
      <ellipse cx="100" cy="130" rx="6" ry="3" fill="#84CC16" />
    
  </g>

  <!-- Top Badge -->
  
  <rect x="32" y="32" width="110" height="32" rx="16" fill="url(#accentGrad)" />
  <text x="87" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">عضوي ممتاز</text>
  

  <!-- Hadramout Hyper Quality Seal -->
  <g transform="translate(420, 32)">
    <circle cx="16" cy="16" r="16" fill="#F1F5F9" />
    <path d="M10 16l4 4 8-8" stroke="#4D7C0F" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Product Title & Subtitle in Arabic -->
  <rect x="28" y="360" width="444" height="108" rx="20" fill="#F8FAFC" />
  <text x="250" y="405" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#1E293B" text-anchor="middle">زيت زيتون بكر ممتاز</text>
  <text x="250" y="438" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">عصرة أولى على البارد 1 لتر</text>
</svg>