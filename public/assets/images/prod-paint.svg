<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="468" height="468" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Backdrop Glow Circle -->
  <circle cx="250" cy="210" r="140" fill="#3B82F6" opacity="0.08" />
  <circle cx="250" cy="210" r="105" fill="#2563EB" opacity="0.12" />

  <!-- Product Icon / Illustration -->
  <g filter="url(#drop)" transform="translate(130, 90)">
    <polygon points="90,90 150,90 142,160 98,160" fill="#E2E8F0" stroke="#3B82F6" stroke-width="4"/><ellipse cx="120" cy="90" rx="30" ry="8" fill="#93C5FD"/><path d="M90 90 C90 65, 150 65, 150 90" fill="none" stroke="#64748B" stroke-width="3"/>
  </g>

  <!-- Top Badge -->
  <rect x="32" y="32" width="115" height="32" rx="16" fill="url(#accentGrad)" />
  <text x="89" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">عالي التغطية</text>

  <!-- Hadramout Hyper Quality Seal -->
  <g transform="translate(420, 32)">
    <circle cx="16" cy="16" r="16" fill="#F1F5F9" />
    <path d="M10 16l4 4 8-8" stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Product Title & Subtitle in Arabic -->
  <rect x="28" y="360" width="444" height="108" rx="20" fill="#F8FAFC" />
  <text x="250" y="405" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#1E293B" text-anchor="middle">سطل بوية داخلي فاخر 18 لتر</text>
  <text x="250" y="438" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">مقاوم للرطوبة قابل للغسيل - أبيض</text>
</svg>