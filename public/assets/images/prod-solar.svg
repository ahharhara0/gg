<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="468" height="468" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Backdrop Glow Circle -->
  <circle cx="250" cy="210" r="140" fill="#0284C7" opacity="0.08" />
  <circle cx="250" cy="210" r="105" fill="#0369A1" opacity="0.12" />

  <!-- Product Icon / Illustration -->
  <g filter="url(#drop)" transform="translate(150, 110)">
    
      <!-- Solar panel grid -->
      <rect x="50" y="40" width="100" height="120" rx="8" fill="#0C4A6E" stroke="#38BDF8" stroke-width="4" />
      <line x1="50" y1="80" x2="150" y2="80" stroke="#38BDF8" stroke-width="2" />
      <line x1="50" y1="120" x2="150" y2="120" stroke="#38BDF8" stroke-width="2" />
      <line x1="100" y1="40" x2="100" y2="160" stroke="#38BDF8" stroke-width="2" />
      <!-- Sun rays -->
      <circle cx="150" cy="30" r="16" fill="#F59E0B" />
    
  </g>

  <!-- Top Badge -->
  
  <rect x="32" y="32" width="110" height="32" rx="16" fill="url(#accentGrad)" />
  <text x="87" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">ضمان 10 سنوات</text>
  

  <!-- Hadramout Hyper Quality Seal -->
  <g transform="translate(420, 32)">
    <circle cx="16" cy="16" r="16" fill="#F1F5F9" />
    <path d="M10 16l4 4 8-8" stroke="#0284C7" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Product Title & Subtitle in Arabic -->
  <rect x="28" y="360" width="444" height="108" rx="20" fill="#F8FAFC" />
  <text x="250" y="405" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#1E293B" text-anchor="middle">لوح طاقة شمسية مونوكريستالين</text>
  <text x="250" y="438" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">قدرة 550 واط كفاءة عالية ومقاومة للحرارة</text>
</svg>